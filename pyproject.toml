[project]
name = "beamng-demo"
version = "0.1.0"
description = "Scripted race and stunt scenarios for the BeamNG simulator, using BeamNGpy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Doctor J", email = "xilcmd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beamngpy==1.35.1",
]

[project.scripts]
beamng-demo = "beamng_demo:main"
beamng-race = "beamng_demo.race:main"
beamng-soapbox = "beamng_demo.soapbox:main"
beamng-bigjump = "beamng_demo.bigjump:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
